pathological_controls:
  - a block pass prevents RuboCop from flattening the preceding keyword hash
  - an unbraced final keyword hash is flattened into individual arguments
  - an explicitly braced hash remains one argument
  - anonymous and multi-line lambda block passes remain call arguments
  - bracket assignment calls are excluded
