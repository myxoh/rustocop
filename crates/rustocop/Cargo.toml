[package]
name = "rustocop"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
glob = "0.3.4"
regex = "1.13.1"
ruby-prism = "1.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-width = "0.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
too_many_lines = "deny"

# Focused cop contracts favor incremental edit/build latency over runtime.
# Full-corpus audits continue to use the optimized release profile.
[profile.fixture]
inherits = "dev"
debug = 0
incremental = true
