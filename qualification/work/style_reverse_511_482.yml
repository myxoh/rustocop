  Style/RedundantCurrentDirectoryInPath:
    matrix_position: 511
    sources:
      rubocop: lib/rubocop/cop/style/redundant_current_directory_in_path.rb
      rustocop: [crates/rustocop/src/cops/prism/argument_default_rules.rs]
    manual_review:
      status: passed
      notes:
        - Both implementations inspect require_relative calls with one static string and report a leading current-directory component.
        - Rustocop preserves RuboCop's argument and interpolation exclusions and removes only the leading ./ bytes.
    upstream_tests: { status: passed, passed: 12, total: 12, corrections: true }
    edge_cases:
      - { id: simple_relative, description: A leading current-directory component is redundant., path: example.rb, source: "require_relative './support'\n" }
      - { id: parent_relative, description: A parent-directory component is meaningful., path: example.rb, source: "require_relative '../support'\n" }
      - { id: clean_relative, description: A direct relative path is accepted., path: example.rb, source: "require_relative 'support'\n" }
      - { id: dynamic_relative, description: Interpolated paths are not rewritten., path: example.rb, source: "require_relative \"./#{name}\"\n" }
      - { id: explicit_receiver, description: RuboCop keys off the method name even with an explicit receiver., path: example.rb, source: "loader.require_relative './support'\n" }
      - { id: repeated_slashes, description: Repeated current-directory components reach RuboCop's autocorrection fixed point., path: example.rb, source: "require_relative './//./support'\n" }
    real_world:
      positives:
        - { repository: sds/overcommit, revision: fee0cd74b26eb81f64b43b7fab17bbb541575cc4, path: overcommit.gemspec, line: 3, source: "require_relative './lib/overcommit/constants'\n" }
