  Style/WhenThen:
    matrix_position: 599
    sources:
      rubocop: lib/rubocop/cop/style/when_then.rb
      rustocop:
        - crates/rustocop/src/cops/prism/branch_layout_rules.rs
    manual_review:
      status: passed
      notes:
        - Both implementations inspect a parsed when branch, require a nonempty body on the same line as the conditions, reject an existing then keyword, and replace only the semicolon separator with ` then`.
        - Manual review replaced Rustocop's first-semicolon-per-line scanner with Prism condition and statement boundaries, so semicolons inside strings or expressions cannot be mistaken for the branch separator and multiline branches are excluded like RuboCop.
    upstream_tests: { status: passed, passed: 4, total: 4, corrections: true }
    edge_cases:
      - id: semicolon_inside_string_condition
        description: Only the separator after a string condition is replaced, not a semicolon in the string.
        path: example.rb
        config: {}
        source: |
          case token
          when "a;b"; handle
          end
      - id: existing_then_with_string_semicolon
        description: A semicolon inside a condition does not create an offense when then is already used.
        path: example.rb
        config: {}
        source: |
          case token
          when "a;b" then handle
          end
      - id: multiline_body_call
        description: A branch whose body expression spans lines is not rewritten to the compact then form.
        path: example.rb
        config: {}
        source: |
          case token
          when :a; handle(
            token
          )
          end
      - id: multiple_conditions
        description: The diagnostic normalizes multiple condition sources with a comma and space.
        path: example.rb
        config: {}
        source: |
          case token
          when :a,:b; handle
          end
    real_world:
