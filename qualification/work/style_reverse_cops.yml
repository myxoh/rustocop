  Style/YAMLFileRead:
    matrix_position: 603
    sources:
      rubocop: lib/rubocop/cop/style/yaml_file_read.rb
      rustocop:
        - crates/rustocop/src/cops/prism/argument_and_inheritance_rules.rs
    manual_review:
      status: passed
      notes:
        - Both implementations match `load`, `safe_load`, or `parse` on root `YAML` only when the first argument is a one-argument root `File.read` call, preserve remaining YAML arguments, and replace from the YAML selector through the call end.
        - Rustocop applies the same Ruby-version gate for `safe_load_file`, accepts both ordinary and `::` root constants, and reconstructs the preferred `_file` call from Prism argument source ranges.
    upstream_tests: { status: passed, passed: 11, total: 11, corrections: true }
    edge_cases:
      - id: multiline_safe_load
        description: A multiline call retains keyword options after replacing File.read.
        path: example.rb
        config: { AllCops: { TargetRubyVersion: 3.4 } }
        source: |
          YAML.safe_load(
            File.read(config_path),
            permitted_classes: [Date],
            aliases: true
          )
      - id: binary_read_is_distinct
        description: File.binread is not the File.read shape handled by this cop.
        path: example.rb
        config: { AllCops: { TargetRubyVersion: 3.4 } }
        source: |
          YAML.load(File.binread(config_path))
      - id: read_with_extra_argument
        description: A File.read call with a length argument cannot become a YAML file call.
        path: example.rb
        config: { AllCops: { TargetRubyVersion: 3.4 } }
        source: |
          YAML.parse(File.read(config_path, 1024))
      - id: ruby_27_safe_load
        description: Ruby 2.7 has no YAML.safe_load_file replacement.
        path: example.rb
        config: { AllCops: { TargetRubyVersion: 2.7 } }
        source: |
          YAML.safe_load(File.read(config_path))
    real_world:
      positives:
        - repository: chatwoot/chatwoot
          revision: 8d93d69e8e356216e85c28de7c4240e66b8e83fa
