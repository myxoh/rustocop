    edge_cases:
      - id: empty_parenthesized_parameters
        description: An explicitly empty argument list is still a lambda without arguments and is not checked.
        path: example.rb
        config: { EnforcedStyle: require_no_parentheses }
        source: |
          callable = ->() { true }
      - id: nested_default_call
        description: Only the outer parameter delimiters are removed when a default expression has its own parentheses.
        path: example.rb
        config: { EnforcedStyle: require_no_parentheses }
        source: |
          callable = ->(value = fallback(1)) { value }
      - id: destructured_parameter
        description: Removing lambda-argument delimiters preserves parentheses required by a destructured parameter.
        path: example.rb
        config: { EnforcedStyle: require_no_parentheses }
        source: |
          callable = ->((left, right)) { left + right }
      - id: shadow_local_only
        description: A shadow-local declaration counts as a nonempty block argument declaration.
        path: example.rb
        config: { EnforcedStyle: require_no_parentheses }
        source: |
          callable = ->(; memo) { memo }
      - id: rest_and_keywords_without_parentheses
        description: Requiring parentheses wraps the complete mixed parameter list.
        path: example.rb
        config: { EnforcedStyle: require_parentheses }
        source: |
          callable = ->first, *rest, option: true { [first, rest, option] }
      - id: multiline_parameters
        description: Delimiter edits preserve multiline parameter content and comments.
        path: example.rb
        config: { EnforcedStyle: require_no_parentheses }
        source: |
          callable = ->(
            first, # primary
            second
          ) { first + second }
      - id: arrow_inside_string_and_comment
        description: Arrow text outside a LambdaNode is never inspected.
        path: example.rb
        config: { EnforcedStyle: require_parentheses }
        source: |
          syntax = "->a,b { a + b }"
          # ->x { x }
      - id: ordinary_lambda_method
        description: The non-stabby lambda method form is outside this cop.
        path: example.rb
