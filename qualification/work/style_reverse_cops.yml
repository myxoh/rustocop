  Style/WordArray:
    matrix_position: 602
    sources:
      rubocop: lib/rubocop/cop/style/word_array.rb
      rustocop:
        - crates/rustocop/src/cops/prism/literal_string_completion_batch.rs
    manual_review:
      status: passed
      notes:
        - Both implementations distinguish bracket and percent array syntax through the parsed array node, apply MinSize and WordRegex, reject bracket arrays with comments or complex content, and suppress child offenses when any row in a string matrix is complex.
        - Rustocop now preserves multiline structure, chooses `%w` versus `%W`, honors configured percent delimiters, balances delimiter escaping, converts `%w` and `%W` back to appropriately quoted bracket elements, and supports interpolated and control-character content.
    upstream_tests: { status: passed, passed: 59, total: 59, corrections: true }
    edge_cases:
      - id: multiline_bracket_array
        description: A multiline bracket array keeps its element line structure in percent form.
        path: example.rb
        config: { MinSize: 0, EnforcedStyle: percent }
        source: |
          values = ["alpha",
                    "beta", "gamma"]
      - id: custom_email_word_regex
        description: A custom word regex permits punctuation that the default word definition rejects.
        path: example.rb
        config: { MinSize: 0, EnforcedStyle: percent, WordRegex: "\\A[\\w@.]+\\z" }
        source: |
          ['first@example.com', 'second@example.com']
      - id: interpolated_wide_array
        description: Bracket style turns an interpolated wide percent array into mixed quoted strings.
        path: example.rb
        config: { MinSize: 0, EnforcedStyle: brackets }
        source: |
          %W(plain #{dynamic}-value)
      - id: complex_string_matrix
        description: A complex row prevents partial percent conversion of a string matrix.
        path: example.rb
        config: { MinSize: 0, EnforcedStyle: percent }
        source: |
          [
            ['one', 'One'],
            ['two words', 'Two Words']
          ]
