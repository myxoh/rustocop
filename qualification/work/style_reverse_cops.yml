  Style/YodaCondition:
    matrix_position: 604
    sources:
      rubocop: lib/rubocop/cop/style/yoda_condition.rb
      rustocop:
        - crates/rustocop/src/cops/prism/yoda_condition_rules.rs
    manual_review:
      status: passed
      notes:
        - Both implementations support the four forbid/require styles, limit equality-only styles to `==` and `!=`, reverse ordered comparison operators during correction, and exempt the `__FILE__` program-name idiom.
        - Rustocop now classifies recursive scalar, array, hash, and range literals through Prism nodes, treats interpolated strings and regexps like RuboCop, and replaces the entire comparison with the same normalized operand order.
    upstream_tests: { status: passed, passed: 76, total: 76, corrections: true }
    edge_cases:
      - id: recursive_array_literal
        description: An array containing only recursive literals is a constant portion.
        path: example.rb
        config: { EnforcedStyle: forbid_for_all_comparison_operators }
        source: |
          [1, { two: 2 }, 3..4] == value
      - id: dynamic_array_literal
        description: A variable nested in an array makes the complete operand dynamic.
        path: example.rb
        config: { EnforcedStyle: forbid_for_all_comparison_operators }
        source: |
          [value] == object.items
      - id: interpolated_regexp
        description: An interpolated regexp on the left is intentionally exempt from Yoda ordering.
        path: example.rb
        config: { EnforcedStyle: forbid_for_all_comparison_operators }
        source: |
          /#{pattern}/ == candidate
      - id: require_yoda_equality_only
        description: Require style reverses equality while leaving ordered comparisons alone.
        path: example.rb
        config: { EnforcedStyle: require_for_equality_operators_only }
        source: |
          answer == 42
          answer < 42
