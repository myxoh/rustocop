      notes:
        - Both implementations operate only on stabby lambdas with a nonempty block-argument declaration, detect parentheses from the argument node's opening delimiter, and switch behavior between require_parentheses and require_no_parentheses.
        - Rustocop now uses Prism lambda and block-parameter locations instead of scanning every arrow in source. Requiring parentheses wraps the complete argument range, while forbidding them atomically removes only the outer delimiters, preserving nested calls, destructuring parentheses, comments, defaults, and shadow-local syntax.
