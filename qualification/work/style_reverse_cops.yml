  Style/WhileUntilModifier:
    matrix_position: 601
    sources:
      rubocop: lib/rubocop/cop/style/while_until_modifier.rb
      rustocop:
        - crates/rustocop/src/cops/prism/compact_syntax_completion.rs
    manual_review:
      status: passed
      notes:
        - Both implementations require a non-modifier while or until node with one nonconditional single-line body, reject local-variable assignment anywhere in the predicate, and enforce the configured Layout/LineLength maximum unless that cop is disabled.
        - Rustocop now derives the condition, body, keyword, parent context, and closing token from Prism; it preserves header comments, parenthesizes low-precedence replacements used as subexpressions, and rejects body comments, trailing end comments, and unsafe first-line-comment contexts.
    upstream_tests: { status: passed, passed: 48, total: 48, corrections: true }
    edge_cases:
      - id: right_hand_side_assignment
        description: A loop used as an assignment value is parenthesized after conversion.
        path: example.rb
        config: { Layout/LineLength: { Max: 100 } }
        source: |
          result = while ready?
            process_one
          end
      - id: preserved_header_comment
        description: A comment attached to the loop predicate moves with the modifier condition.
        path: example.rb
        config: { Layout/LineLength: { Max: 100 } }
        source: |
          until ready? # polling boundary
            poll
          end
      - id: nested_predicate_assignment
        description: An assignment nested in the predicate prevents modifier conversion.
        path: example.rb
        config: { Layout/LineLength: { Max: 100 } }
        source: |
          while ready? && (item = queue.shift)
            consume(item)
          end
      - id: conditional_body
        description: A modifier conditional body is intentionally left in multiline loop form.
        path: example.rb
        config: { Layout/LineLength: { Max: 100 } }
        source: |
          while running?
            stop if expired?
          end
    real_world:
