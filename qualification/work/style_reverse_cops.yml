  Style/WhileUntilDo:
    matrix_position: 600
    sources:
      rubocop: lib/rubocop/cop/style/while_until_do.rb
      rustocop:
        - crates/rustocop/src/cops/prism/while_until_do_rules.rs
    manual_review:
      status: passed
      notes:
        - Both implementations operate on parsed while and until nodes, require an explicit do token and a multiline loop expression, and report precisely the do token with the loop keyword in the message.
        - Rustocop removes the complete source range from the predicate end through the do token, matching RuboCop for intervening whitespace and multiline predicates while leaving single-line loops and non-code lookalikes untouched.
    upstream_tests: { status: passed, passed: 6, total: 6, corrections: true }
    edge_cases:
      - id: multiline_predicate
        description: The do token after a predicate split across lines is removed with its leading gap.
        path: example.rb
        config: {}
        source: |
          while ready? &&
                pending? do
            work
          end
      - id: empty_until_body
        description: An explicit do is still redundant on a multiline loop with no body.
        path: example.rb
        config: {}
        source: |
          until ready? do
          end
      - id: single_line_loop
        description: A do token remains valid when the complete loop occupies one line.
        path: example.rb
        config: {}
        source: |
          while ready? do work end
      - id: heredoc_shell_loop
        description: Shell syntax resembling a loop is content of an xstring, not a Ruby while node.
        path: example.rb
        config: {}
        source: |
          script = <<~`SH`
            while read value; do
              echo "$value"
            done
          SH
    real_world:
      positives:
        - repository: OpenSUTD/DDDDDDDDDD
          revision: 7532b8567eb29797a7f2db2765326e7fbdb4b92c
