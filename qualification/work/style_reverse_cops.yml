  Style/YodaExpression:
    matrix_position: 605
    sources:
      rubocop: lib/rubocop/cop/style/yoda_expression.rb
      rustocop:
        - crates/rustocop/src/cops/prism/structural_completion_rules.rs
    manual_review:
      status: passed
      notes:
        - Both implementations inspect configured commutative operators, require a numeric or constant left operand and a nonconstant right operand, suppress nested duplicate offenses, and swap operands for correction.
        - Source review found that Rustocop formerly treated symbols, booleans, nil, regexps, and ranges as numeric constants; its Prism predicate now matches RuboCop's numeric, constant-read, and constant-path node set exactly.
    upstream_tests: { status: passed, passed: 10, total: 10, corrections: true }
    edge_cases:
      - id: rational_literal
        description: Rational literals are numeric Yoda operands.
        path: example.rb
        config: { SupportedOperators: ["+"] }
        source: |
          1r + value
      - id: symbol_is_not_numeric
        description: A symbol is a literal but not one of RuboCop's numeric operands.
        path: example.rb
        config: { SupportedOperators: ["|"] }
        source: |
          :mask | value
      - id: boolean_is_not_numeric
        description: Boolean literals are not numeric operands for this cop.
        path: example.rb
        config: { SupportedOperators: ["&"] }
        source: |
          true & value
      - id: outermost_nested_expression
        description: Only the outermost nested Yoda expression is reported and correction recursively normalizes it.
        path: example.rb
        config: { SupportedOperators: ["+"] }
        source: |
          3 + (TWO + (1 + value))
    real_world:
      positives:
