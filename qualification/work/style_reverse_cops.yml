  Style/SafeNavigation:
    matrix_position: 547
    sources:
      rubocop: lib/rubocop/cop/style/safe_navigation.rb
      rustocop:
        - crates/rustocop/src/cops/prism/final_ast_structural_batch.rs
        - crates/rustocop/src/cops/prism/final_ast_structural_batch/registry.rs
    manual_review:
      status: passed
      notes:
        - Rustocop now follows RuboCop structurally across modifier and full if/unless forms, ternaries, flattened &&/and clauses, chained and safe-navigation receivers, all six variable families, comments, blocks, and coordinated multi-offense corrections.
        - The implementation mirrors the Ruby-version gate, MaxChainLength, ConvertCodeThatCanStartToReturnNil, AllowedMethods/nil-method safety, Lint/SafeNavigationChain interaction, dotless/operator/assignment exclusions, and the report-only RHS-or case.
        - Receiver comparison normalizes safe-navigation and insignificant whitespace only outside quoted, regexp, and percent-literal contents, preventing distinct literal arguments from being treated as the same guarded expression.
    upstream_tests: { status: passed, passed: 798, total: 798, corrections: true }
    edge_cases:
      - id: conditional_forms
        description: Modifier, multiline, unless-nil, and ternary guards all reduce to safe navigation.
        path: example.rb
        source: |
          account.owner if account
          if account
            account.owner.profile
          end
          account.owner unless account.nil?
          account ? account.owner : nil
      - id: structurally_equal_accessor_spacing
        description: Insignificant formatting differences in an accessor guard do not prevent structural receiver matching.
        path: example.rb
        source: |
          lookup( "a b" ) && lookup("a b").name
          lookup(%q[a b]) && lookup( %q[a b] ).name
      - id: distinct_literal_arguments
        description: Whitespace and safe-navigation-looking text inside literal arguments remain semantically significant and cannot create a false match.
        path: example.rb
        source: |
          lookup("a b") && lookup("ab").name
          lookup("a&.b") && lookup("a.b").name
          lookup(/a b/) && lookup(/ab/).name
      - id: chained_safe_guard_and_comments
        description: An existing safe guard is reused, every following call becomes safe, and comments outside an inner block are retained.
        path: example.rb
        source: |
          if account&.owner # owner may be absent
            # retain this comment
            account.owner.profile.each do |profile|
              consume(profile) # retain inner comment
            end
          end # retain trailing comment
      - id: multiple_and_clauses
        description: Adjacent and independent guarded clauses receive coordinated corrections without duplicate or stale offenses.
        path: example.rb
        source: |
          account && account.owner && account.owner.profile
          account && account.active? && company && company.active?
      - id: rhs_or_is_report_only
        description: A matching receiver inside an OR branch containing AND is diagnosed but intentionally not autocorrected.
        path: example.rb
        source: |
          account && (account.active? || (account.owner? && account.admin?))
      - id: unsafe_method_contexts
        description: Index access, arithmetic/comparison results, assignment, empty?, and configured nil-safe methods are not converted.
        path: example.rb
        source: |
          account && account[:owner]
          account && account.score > 2
          account.name = value if account
          account && account.empty?
          account && account.owner.present?
      - id: non_nil_conversion_config
        description: Explicit non-nil guards convert only when the semantic-return expansion is enabled.
        path: example.rb
        config:
          Style/SafeNavigation: { ConvertCodeThatCanStartToReturnNil: true }
        source: |
          !account.nil? && account.owner
      - id: chain_and_lint_configuration
        description: MaxChainLength limits candidates and disabling SafeNavigationChain prevents generation of a multi-call safe chain.
        path: example.rb
        config:
          Style/SafeNavigation: { MaxChainLength: 3 }
          Lint/SafeNavigationChain: { Enabled: false }
        source: |
          account && account.owner.profile
          account.owner.profile.region if account
      - id: ruby_version_gate
        description: Safe-navigation conversion is unavailable before Ruby 2.3.
        path: example.rb
        config:
          AllCops: { TargetRubyVersion: 2.2 }
        source: |
          account && account.owner
