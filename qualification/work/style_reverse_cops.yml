  Style/ZeroLengthPredicate:
    matrix_position: 606
    sources:
      rubocop: lib/rubocop/cop/style/zero_length_predicate.rb
      rustocop:
        - crates/rustocop/src/cops/prism/modern_collection_completion.rs
    manual_review:
      status: passed
      notes:
        - Both implementations restrict the receiver method to argument-free `length` or `size`, handle zero, one, reversed, and `zero?` forms, and preserve `.` versus `&.` in correction output.
        - Rustocop now uses Prism call identity for the parent comparison, matches RuboCop's safe-navigation restriction on nonzero comparisons, and excludes File::Stat, File, Tempfile, and StringIO size checks.
    upstream_tests: { status: passed, passed: 68, total: 68, corrections: true }
    edge_cases:
      - id: reversed_safe_navigation_zero
        description: A reversed comparison preserves the safe-navigation operator.
        path: example.rb
        config: {}
        source: |
          1 > records&.length
      - id: nonzero_safe_navigation_is_ignored
        description: Nonzero comparisons through safe navigation cannot become a boolean negation safely.
        path: example.rb
        config: {}
        source: |
          records&.size > 0
      - id: multiline_receiver
        description: Structural matching works when the collection expression spans lines.
        path: example.rb
        config: {}
        source: |
          records
            .select(&:active?)
            .length == 0
      - id: string_and_comment_decoys
        description: Text resembling a comparison in strings and comments is not inspected as code.
        path: example.rb
        config: {}
        source: |
          text = 'records.length == 0'
          # records.size > 0
          records.empty?
    real_world:
      positives:
        - repository: gitlabhq/gitlabhq
          revision: 67a526442c20d20b6e80ebf916bd766b54018c5e
