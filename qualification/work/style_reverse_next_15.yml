    edge_cases:
      - { id: guarded_bare_return, description: A bare guarded return in a predicate becomes return false., path: example.rb, config: {}, source: "def ready?\n  return if loading?\n  true\nend\n" }
      - { id: implicit_nil_branch, description: A terminal nil conditional branch becomes false., path: example.rb, config: {}, source: "def ready?\n  if loading?\n    nil\n  else\n    true\n  end\nend\n" }
      - { id: allowed_predicate, description: AllowedMethods exempts the complete predicate., path: example.rb, config: { AllowedMethods: [ready?] }, source: "def ready?\n  return nil\nend\n" }
      - { id: ordinary_method, description: Nil remains valid in a non-predicate method., path: example.rb, config: {}, source: "def result\n  return nil\nend\n" }
