cops:
  Style/ReverseFind:
    matrix_position: 546
    sources:
      rubocop: lib/rubocop/cop/style/reverse_find.rb
      rustocop: [crates/rustocop/src/cops/prism/call_conversion_rules.rs]
    manual_review:
      status: passed
      notes:
        - Both implementations match `find` or `detect` after `reverse` or `reverse_each`, including block-pass forms, and replace the joined selectors with `rfind`.
        - Rustocop retains RuboCop's Ruby 4.0 target-version gate and uses Prism selector ranges, while RuboCop expresses the same shape through `def_node_matcher`.
    upstream_tests: { status: passed, passed: 14, total: 14, corrections: true }
    edge_cases:
      - { id: reverse_find_block, description: A reverse/find block becomes rfind., path: example.rb, config: { AllCops: { TargetRubyVersion: 4.0 } }, source: "items.reverse.find { |item| item.ready? }\n" }
      - { id: reverse_each_detect_block_pass, description: reverse_each and detect with a block pass share the same replacement., path: example.rb, config: { AllCops: { TargetRubyVersion: 4.0 } }, source: "items.reverse_each.detect(&:ready?)\n" }
      - { id: unavailable_before_ruby_4, description: rfind is unavailable before Ruby 4.0., path: example.rb, config: { AllCops: { TargetRubyVersion: 3.4 } }, source: "items.reverse.find(&:ready?)\n" }
      - { id: already_rfind, description: An existing rfind call is accepted., path: example.rb, config: { AllCops: { TargetRubyVersion: 4.0 } }, source: "items.rfind(&:ready?)\n" }
    real_world:
      positives:
        - repository: postalserver/postal
          revision: d038eaa8c763d3cafa797ccd6f773d53470bd336
          path: app/lib/smtp_server/client.rb
          line: 393
          config: { AllCops: { TargetRubyVersion: 4.0 } }
          source: |
            Credential.where(type: "SMTP-IP").all.sort_by { |c| c.ipaddr&.prefix || 0 }.reverse.find do |credential|
              credential.ipaddr.include?(@ip_address)
            end
        - repository: whiteleaf7/narou
          revision: 27fb741fd561e2f26aba9fdf9d9b7b4384792be4
          path: lib/command/log.rb
          line: 74
          config: { AllCops: { TargetRubyVersion: 4.0 } }
          source: |
            Narou.log_dir.glob("*").sort_by(&:mtime).reverse.find do |path|
              path_matches_source?(path)
            end
      negatives:
        - { repository: postalserver/postal, revision: d038eaa8c763d3cafa797ccd6f773d53470bd336, path: app/lib/smtp_server/client.rb, line: 394, config: { AllCops: { TargetRubyVersion: 4.0 } }, source: "credential.ipaddr.include?(@ip_address)\n" }
        - { repository: whiteleaf7/narou, revision: 27fb741fd561e2f26aba9fdf9d9b7b4384792be4, path: lib/command/log.rb, line: 75, config: { AllCops: { TargetRubyVersion: 4.0 } }, source: "path_matches_source?(path)\n" }

  Style/ReturnNilInPredicateMethodDefinition:
    matrix_position: 545
    sources:
      rubocop: lib/rubocop/cop/style/return_nil_in_predicate_method_definition.rb
      rustocop: [crates/rustocop/src/cops/prism/return_nil_predicate_rules.rs]
    manual_review:
      status: passed
      notes:
        - Both implementations enter predicate definitions only, honor AllowedMethods and AllowedPatterns, inspect explicit nil returns, and recurse through terminal conditional branches.
        - The Rust rule mirrors RuboCop's `on_def`, `return_nil`, `handle_return`, `handle_implicit_return_values`, and `register_offense` boundaries with typed Prism nodes.
