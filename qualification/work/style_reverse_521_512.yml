  Style/RedundantHeredocDelimiterQuotes:
    matrix_position: 520
    sources:
      rubocop: lib/rubocop/cop/style/redundant_heredoc_delimiter_quotes.rb
      rustocop: [crates/rustocop/src/cops/prism/lexical_completion.rs]
    manual_review:
      status: passed
      notes:
        - Both implementations inspect quoted heredoc openers and remove quotes only when the body has no interpolation-like text and the delimiter is legal unquoted.
        - Rustocop matches RuboCop's exclusions for backticks, interpolation markers, quotes or whitespace in delimiter names, and all three heredoc indentation forms.
    upstream_tests: { status: passed, passed: 17, total: 17, corrections: true }
    edge_cases:
      - id: single_quoted_squiggly
        description: Quotes around a simple squiggly heredoc delimiter are redundant.
        path: example.rb
        source: |
          do_something(<<~'EOS')
            plain text
          EOS
      - id: double_quoted_dash
        description: Double quotes around a simple dash heredoc delimiter are redundant.
        path: example.rb
        source: |
          do_something(<<-"EOS")
            plain text
          EOS
      - id: interpolation_text
        description: Single quotes are meaningful when the body contains interpolation syntax as text.
        path: example.rb
        source: |
          do_something(<<~'EOS')
            #{name}
          EOS
      - id: spaced_delimiter
        description: A delimiter containing a space must remain quoted.
        path: example.rb
        source: |
          do_something(<<~'EDGE CASE')
            plain text
          EDGE CASE
