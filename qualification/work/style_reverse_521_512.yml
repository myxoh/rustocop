  Style/RedundantInitialize:
    matrix_position: 521
    sources:
      rubocop: lib/rubocop/cop/style/redundant_initialize.rb
      rustocop: [crates/rustocop/src/cops/prism/declaration_completion_rules.rs]
    manual_review:
      status: passed
      notes:
        - Both implementations visit initialize definitions and remove only empty methods or methods whose sole operation is an equivalent super call.
        - Rustocop preserves RuboCop's guards for default arguments, explicit mismatched super arguments, comments, forwarding parameters, and additional body statements.
    upstream_tests: { status: passed, passed: 23, total: 23, corrections: true }
    edge_cases:
      - { id: empty_initialize, description: An argument-free empty initializer is redundant., path: example.rb, source: "def initialize\nend\n" }
      - { id: matching_super, description: Forwarding the same positional arguments through super is redundant., path: example.rb, source: "def initialize(a, b)\n  super(a, b)\nend\n" }
      - { id: default_argument, description: A default argument changes construction semantics and must remain., path: example.rb, source: "def initialize(a = 5)\n  super\nend\n" }
      - { id: meaningful_body, description: Initializer state assignment must remain., path: example.rb, source: "def initialize(server)\n  @server = server\nend\n" }
    real_world:
      positives:
        - repository: rails/rails
          revision: f2c5779757a083a7e511ea8994aee8e1d71564eb
          path: activesupport/test/callbacks_test.rb
          line: 128
          source: |
            def initialize
              super
            end
        - repository: rails/rails
          revision: f2c5779757a083a7e511ea8994aee8e1d71564eb
          path: activerecord/lib/active_record/connection_adapters/postgresql/quoting.rb
          line: 64
          source: |
            def initialize(msg)
              super(msg)
            end
      negatives:
