schema: 1
batch: project_cops
rubocop_version: 1.87.0
rubocop_commit: e5b788dba181ad94de30cfbad661c5d6aa08a4e5
rustocop_commit: pending
cops:
  Bundler/DuplicatedGem:
    matrix_position: 1
    sources:
      rubocop: lib/rubocop/cop/bundler/duplicated_gem.rb
      rustocop:
        - crates/rustocop/src/cops/prism/source_rules.rs
        - crates/rustocop/src/cops/prism/source_rules/project_files.rs
    manual_review:
      status: failed
      notes:
        - RuboCop groups implicit-receiver gem calls by their first string AST argument and exempts duplicates wholly contained in one root conditional.
        - Rustocop now models conditional branches and nested blocks, but its line-oriented parser does not cover every multiline or semicolon-separated call shape.
    upstream_tests: { status: passed, passed: 10, total: 10, corrections: true }
    edge_cases:
      - id: duplicate_across_groups
        description: Duplicate declarations in separate group blocks remain duplicates.
        path: Gemfile
        config: {}
        source: |
          group :development do
            gem 'rack'
          end
          group :test do
            gem 'rack'
          end
      - id: conditional_alternatives
        description: Alternative versions in one if/else are not duplicates.
        path: Gemfile
        config: {}
        source: |
          if local?
            gem 'rack', path: 'vendor/rack'
          else
            gem 'rack', '~> 3.0'
          end
      - id: mixed_quote_duplicate
        description: Single and double quoted names identify the same gem.
        path: Gemfile
        config: {}
        source: |
          gem 'rack'
          gem "rack"
      - id: parenthesized_duplicate
        description: Parenthesized implicit gem calls are included.
        path: Gemfile
        config: {}
        source: |
          gem('rack')
          gem('rack', '~> 3.0')
    real_world:
      positives: []
      negatives:
        - repository: chatwoot/chatwoot
          revision: 8d93d69e8e356216e85c28de7c4240e66b8e83fa
          path: Gemfile
          line: 7
          source: |
            gem 'rack-cors', '2.0.0', require: 'rack/cors'
        - repository: rubygems/rubygems.org
          revision: 3201f8831866f82eb9acd7f66287a978d0e59079
          path: Gemfile
          line: 7
          source: |
            gem "rails", "~> 8.1.3"

  Bundler/DuplicatedGroup:
    matrix_position: 2
    sources:
      rubocop: lib/rubocop/cop/bundler/duplicated_group.rb
      rustocop:
        - crates/rustocop/src/cops/prism/project_scope_completion.rs
    manual_review:
      status: failed
      notes:
        - RuboCop canonicalizes the complete set of group arguments, keyword pairs, and the nearest source/git/platforms/path ancestor.
        - Rustocop now compares complete group sets and source scopes but still uses a textual block stack for complex Ruby expressions.
    upstream_tests: { status: passed, passed: 21, total: 21, corrections: true }
    edge_cases:
      - id: reordered_group_set
        description: A reordered set of group names is the same declaration.
        path: Gemfile
        config: {}
        source: |
          group :test, :development do
          end
          group :development, :test do
          end
      - id: overlapping_not_duplicate
        description: Overlapping but unequal sets are not duplicates.
        path: Gemfile
        config: {}
        source: |
          group :development do
          end
          group :development, :test do
          end
      - id: reordered_keyword_options
        description: Keyword pair order does not change group identity.
        path: Gemfile
        config: {}
        source: |
          group :test, foo: true, bar: false do
          end
          group :test, bar: false, foo: true do
          end
      - id: different_source_scopes
        description: Equal groups in distinct source blocks are independent.
        path: Gemfile
        config: {}
        source: |
          source 'https://one.example' do
            group :test do
            end
          end
          source 'https://two.example' do
            group :test do
            end
          end
    real_world:
      positives: []
      negatives:
        - repository: chatwoot/chatwoot
          revision: 8d93d69e8e356216e85c28de7c4240e66b8e83fa
          path: Gemfile
          line: 220
          source: |
            group :production do
            end
        - repository: rubygems/rubygems.org
          revision: 3201f8831866f82eb9acd7f66287a978d0e59079
          path: Gemfile
          line: 82
          source: |
            group :avo, optional: true do
            end

  Bundler/GemComment:
    matrix_position: 3
    sources:
      rubocop: lib/rubocop/cop/bundler/gem_comment.rb
      rustocop:
        - crates/rustocop/src/cops/prism/final_project_context_batch.rs
    manual_review:
      status: failed
      notes:
        - RuboCop accepts adjacent, inline, or descendant comments and filters by IgnoredGems and the OnlyFor option vocabulary.
        - Rustocop now implements the configuration vocabulary and adjacent/inline comments but does not yet associate comments inside multiline call descendants.
    upstream_tests: { status: passed, passed: 26, total: 26, corrections: true }
    edge_cases:
      - id: ordinary_uncommented_gem
        description: An ordinary uncommented declaration is checked when OnlyFor is empty.
        path: Gemfile
        config: { OnlyFor: [], IgnoredGems: [] }
        source: |
          gem 'rack'
      - id: adjacent_description
        description: A directly preceding comment describes the gem.
        path: Gemfile
        config: { OnlyFor: [], IgnoredGems: [] }
        source: |
          # HTTP server interface.
          gem 'rack'
      - id: ignored_gem
        description: Explicitly ignored gem names do not require comments.
        path: Gemfile
        config: { OnlyFor: [], IgnoredGems: [rack] }
        source: |
          gem 'rack'
      - id: restrictive_minimum_only
        description: A minimum-only constraint is not restrictive.
        path: Gemfile
        config: { OnlyFor: [restrictive_version_specifiers], IgnoredGems: [] }
        source: |
          gem 'rack', '>= 3.0'
    real_world:
      positives:
        - repository: chatwoot/chatwoot
          revision: 8d93d69e8e356216e85c28de7c4240e66b8e83fa
          path: Gemfile
          line: 7
          source: |
            gem 'rack-cors', '2.0.0', require: 'rack/cors'
        - repository: rubygems/rubygems.org
          revision: 3201f8831866f82eb9acd7f66287a978d0e59079
          path: Gemfile
          line: 7
          source: |
            gem "rails", "~> 8.1.3"
      negatives:
        - repository: chatwoot/chatwoot
          revision: 8d93d69e8e356216e85c28de7c4240e66b8e83fa
          path: Gemfile
          line: 10
          source: |
            # Reduces boot times through caching; required in config/boot.rb
            gem 'bootsnap', require: false
        - repository: gitlabhq/gitlabhq
          revision: 67a526442c20d20b6e80ebf916bd766b54018c5e
          path: Gemfile
          line: 27
          source: |
            # Pin Zeitwerk until https://gitlab.com/gitlab-org/omnibus-gitlab/-/issues/9408 is fixed
            gem 'zeitwerk', '= 2.6.18', feature_category: :rails_platform

  Bundler/GemFilename:
    matrix_position: 4
    sources:
      rubocop: lib/rubocop/cop/bundler/gem_filename.rb
      rustocop:
        - crates/rustocop/src/cops/prism/bundler_completion.rs
    manual_review:
      status: passed
      notes:
        - Both implementations compare the basename against Gemfile/Gemfile.lock or gems.rb/gems.locked according to EnforcedStyle.
        - Rustocop now preserves the complete reported path and emits the same global messages and zero-width location as RuboCop.
    upstream_tests: { status: passed, passed: 15, total: 15, corrections: true }
    edge_cases:
      - id: default_rejects_gems_rb
        description: Default Gemfile style rejects gems.rb.
        path: config/gems.rb
        config: { EnforcedStyle: Gemfile }
        source: |
          source 'https://rubygems.org'
      - id: default_accepts_nested_gemfile
        description: Gemfile style accepts a nested Gemfile path.
        path: config/Gemfile
        config: { EnforcedStyle: Gemfile }
        source: |
          source 'https://rubygems.org'
      - id: gems_rb_rejects_lock
        description: gems.rb style rejects Gemfile.lock.
        path: config/Gemfile.lock
        config: { EnforcedStyle: gems.rb }
        source: |
          GEM
      - id: gems_rb_accepts_locked
        description: gems.rb style accepts gems.locked.
        path: config/gems.locked
        config: { EnforcedStyle: gems.rb }
        source: |
          GEM
    real_world:
      positives: []
      negatives:
        - repository: chatwoot/chatwoot
          revision: 8d93d69e8e356216e85c28de7c4240e66b8e83fa
          path: Gemfile
          line: 1
          source: |
            source 'https://rubygems.org'
        - repository: rubygems/rubygems.org
          revision: 3201f8831866f82eb9acd7f66287a978d0e59079
          path: Gemfile
          line: 3
          source: |
            source "https://rubygems.org"

  Bundler/GemVersion:
    matrix_position: 5
    sources:
      rubocop: lib/rubocop/cop/bundler/gem_version.rb
      rustocop:
        - crates/rustocop/src/cops/prism/source_semantics.rs
    manual_review:
      status: failed
      notes:
        - RuboCop recognizes numeric version strings and static branch/ref/tag commit references on implicit gem calls, with AllowedGems filtering.
        - Rustocop now distinguishes positional versions from quoted keyword values but remains line-oriented for parenthesized or multiline declarations.
    upstream_tests: { status: passed, passed: 6, total: 6, corrections: true }
    edge_cases:
      - id: required_without_version
        description: Required style reports a bare declaration.
        path: Gemfile
        config: { EnforcedStyle: required, AllowedGems: [] }
        source: |
          gem 'rack'
      - id: required_commit_reference
        description: A branch reference satisfies required style.
        path: Gemfile
        config: { EnforcedStyle: required, AllowedGems: [] }
        source: |
          gem 'rack', branch: 'main'
      - id: forbidden_version
        description: Forbidden style reports a numeric requirement.
        path: Gemfile
        config: { EnforcedStyle: forbidden, AllowedGems: [] }
        source: |
          gem 'rack', '~> 3.0'
      - id: allowed_bare_gem
        description: AllowedGems exempts a bare declaration.
        path: Gemfile
        config: { EnforcedStyle: required, AllowedGems: [rack] }
        source: |
          gem 'rack'
    real_world:
      positives:
        - repository: chatwoot/chatwoot
          revision: 8d93d69e8e356216e85c28de7c4240e66b8e83fa
          path: Gemfile
          line: 11
          source: |
            gem 'bootsnap', require: false
        - repository: chatwoot/chatwoot
          revision: 8d93d69e8e356216e85c28de7c4240e66b8e83fa
          path: Gemfile
          line: 14
          source: |
            gem 'acts-as-taggable-on'
      negatives:
        - repository: rubygems/rubygems.org
          revision: 3201f8831866f82eb9acd7f66287a978d0e59079
          path: Gemfile
          line: 7
          source: |
            gem "rails", "~> 8.1.3"
        - repository: gitlabhq/gitlabhq
          revision: 67a526442c20d20b6e80ebf916bd766b54018c5e
          path: Gemfile
          line: 28
          source: |
            gem 'zeitwerk', '= 2.6.18', feature_category: :rails_platform

  Bundler/InsecureProtocolSource:
    matrix_position: 6
    sources:
      rubocop: lib/rubocop/cop/bundler/insecure_protocol_source.rb
      rustocop:
        - crates/rustocop/src/cops/prism/additional_rules.rs
    manual_review:
      status: failed
      notes:
        - RuboCop matches only implicit source calls whose argument is a legacy symbol or the exact HTTP rubygems URL and respects AllowHttpProtocol.
        - Rustocop now restricts matching to source calls and supports both quote styles, but multiline call arguments remain outside its scanner.
    upstream_tests: { status: passed, passed: 6, total: 6, corrections: true }
    edge_cases:
      - id: legacy_symbol
        description: A legacy source symbol is always insecure.
        path: Gemfile
        config: { AllowHttpProtocol: true }
        source: |
          source :gemcutter
      - id: allowed_http
        description: The legacy HTTP URL is allowed when configured.
        path: Gemfile
        config: { AllowHttpProtocol: true }
        source: |
          source 'http://rubygems.org'
      - id: forbidden_http_double_quotes
        description: Disallowing HTTP also handles double-quoted URLs.
        path: Gemfile
        config: { AllowHttpProtocol: false }
        source: |
          source "http://rubygems.org"
      - id: unrelated_symbol
        description: A matching symbol outside a source call is ignored.
        path: Gemfile
        config: { AllowHttpProtocol: false }
        source: |
          mirror = :gemcutter
    real_world:
      positives:
        - repository: gitlabhq/gitlabhq
          revision: 67a526442c20d20b6e80ebf916bd766b54018c5e
          path: vendor/gems/omniauth_crowd/Gemfile
          line: 1
          source: |
            source 'http://rubygems.org'
      negatives:
        - repository: chatwoot/chatwoot
          revision: 8d93d69e8e356216e85c28de7c4240e66b8e83fa
          path: Gemfile
          line: 1
          source: |
            source 'https://rubygems.org'
        - repository: rubygems/rubygems.org
          revision: 3201f8831866f82eb9acd7f66287a978d0e59079
          path: Gemfile
          line: 3
          source: |
            source "https://rubygems.org"

  Bundler/OrderedGems:
    matrix_position: 7
    sources:
      rubocop: lib/rubocop/cop/bundler/ordered_gems.rb
      rustocop:
        - crates/rustocop/src/cops/prism/bundler_completion.rs
    manual_review:
      status: failed
      notes:
        - RuboCop compares consecutive gem AST declarations and canonicalizes only hyphens and underscores unless ConsiderPunctuation is true.
        - Rustocop now uses the same punctuation canonicalization but its source chunk grouping is not equivalent for every multiline call/comment layout.
    upstream_tests: { status: passed, passed: 17, total: 17, corrections: true }
    edge_cases:
      - id: ordinary_out_of_order
        description: Consecutive names are alphabetized case-insensitively.
        path: Gemfile
        config: { TreatCommentsAsGroupSeparators: true, ConsiderPunctuation: false }
        source: |
          gem 'zlib'
          gem 'rack'
      - id: comment_separator
        description: A comment starts a new section when configured.
        path: Gemfile
        config: { TreatCommentsAsGroupSeparators: true, ConsiderPunctuation: false }
        source: |
          gem 'zlib'
          # Web interface.
          gem 'rack'
      - id: comment_attached_to_gem
        description: Comments travel with declarations when not separators.
        path: Gemfile
        config: { TreatCommentsAsGroupSeparators: false, ConsiderPunctuation: false }
        source: |
          gem 'zlib'
          # Web interface.
          gem 'rack'
      - id: blank_line_separator
        description: A blank line always separates sections.
        path: Gemfile
        config: { TreatCommentsAsGroupSeparators: false, ConsiderPunctuation: false }
        source: |
          gem 'zlib'

          gem 'rack'
    real_world:
      positives:
        - repository: chatwoot/chatwoot
