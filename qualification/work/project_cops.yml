      - id: indexed_only
        description: Multiple indexed writes are consistent.
        path: example.gemspec
        config: {}
        source: |
          Gem::Specification.new do |gem|
            gem.metadata['one'] = '1'
            gem.metadata['two'] = '2'
          end
      - id: different_attributes
        description: Different attributes may use different styles.
        path: example.gemspec
        config: {}
        source: |
